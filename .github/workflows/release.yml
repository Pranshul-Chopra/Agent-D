name: Release Agent-D

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Backend Regression Test Suite
        env:
          AGENT_D_AUTH_TOKEN: 'ci_test_token_32_bytes_release_check'
        run: |
          python test_m1.py
          python test_m2.py
          python -m unittest test_m3.py test_m4.py test_m5.py test_m6_actions.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'electron/package-lock.json'

      - name: Install Electron Dependencies
        working-directory: electron
        run: npm ci

      - name: Build React SPA Frontend
        working-directory: electron
        run: npm run build:ui

      - name: Freeze Python Backend with PyInstaller
        run: |
          python -m PyInstaller flask.spec --noconfirm

      - name: Sync Frontend Assets to Frozen Backend
        shell: pwsh
        run: |
          if (Test-Path "dist/flask/_internal/static/spa") {
            Copy-Item -Recurse -Force static/spa/* dist/flask/_internal/static/spa/
          }

      - name: Package Desktop Executables with electron-builder
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --win --publish never

      - name: Publish GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
